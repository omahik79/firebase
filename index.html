<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contacts CRUD - Omar</title>
</head>
<body>

  <h2>📇 Contacts App</h2>

  <input type="text" id="first_name" placeholder="First Name">
  <input type="text" id="last_name" placeholder="Last Name">
  <input type="email" id="email" placeholder="Email">
  <button onclick="addContact()">Add Contact</button>

  <h3>Contact List</h3>
  <ul id="contactList"></ul>

  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      deleteDoc, 
      doc, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC4lSCRdRiVDwFQndS8wqni8n0QwfcAVHE",
      authDomain: "omar1-146c1.firebaseapp.com",
      databaseURL: "https://omar1-146c1.firebaseio.com",
      projectId: "omar1-146c1",
      storageBucket: "omar1-146c1.firebasestorage.app",
      messagingSenderId: "934494057660",
      appId: "1:934494057660:web:4dd67aec5a241601220cb9",
      measurementId: "G-TFSQCFP0ZE"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    const contactList = document.getElementById("contactList");

    // CREATE
    window.addContact = async function () {
      const first_name = document.getElementById("first_name").value;
      const last_name = document.getElementById("last_name").value;
      const email = document.getElementById("email").value;

      await addDoc(collection(db, "contacts"), {
        first_name: first_name,
        last_name: last_name,
        email: email
      });

      alert("Contact Added ✅");
      loadContacts();
    };

    // READ
    async function loadContacts() {
      contactList.innerHTML = "";
      const snapshot = await getDocs(collection(db, "contacts"));

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const li = document.createElement("li");

        li.innerHTML = `
          ${data.first_name} ${data.last_name} - ${data.email}
          <button onclick="editContact('${docSnap.id}')">Edit</button>
          <button onclick="deleteContact('${docSnap.id}')">Delete</button>
        `;

        contactList.appendChild(li);
      });
    }

    // UPDATE
    window.editContact = async function (id) {
      const newFirst = prompt("New First Name:");
      const newLast = prompt("New Last Name:");
      const newEmail = prompt("New Email:");

      await updateDoc(doc(db, "contacts", id), {
        first_name: newFirst,
        last_name: newLast,
        email: newEmail
      });

      alert("Updated ✏️");
      loadContacts();
    };

    // DELETE
    window.deleteContact = async function (id) {
      await deleteDoc(doc(db, "contacts", id));
      alert("Deleted ❌");
      loadContacts();
    };

    loadContacts();
  </script>

</body>
</html>
